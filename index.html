<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VA Tracker</title>
  <script>
    // Set the theme before the page paints (saved choice, else the system setting).
    (function () {
      var t = null;
      try { t = localStorage.getItem('vat-theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <div class="brand">VA Tracker <span id="brandDomain"></span></div>
      <span class="updated" id="updated"></span>
      <span class="updated" id="userChip" hidden></span>
      <button class="btn" id="themeBtn" type="button" aria-pressed="false">🌙 Dark</button>
      <button class="btn" id="refreshBtn" type="button">↻ Refresh</button>
      <button class="btn" id="logoutBtn" type="button" hidden>Log out</button>
    </div>
  </header>

  <!-- Sign in with a OnePopHealth username; each user sees their own domain's VA data. -->
  <form class="login" id="login" hidden>
    <h2>Sign in</h2>
    <p class="muted">Use your OnePopHealth username.</p>
    <input id="loginUser" placeholder="Username" autocomplete="username">
    <div class="login-error" id="loginError"></div>
    <button class="btn btn-primary" type="submit">Continue</button>
  </form>

  <main class="page" id="main" hidden>
    <section class="toolbar">
      <div class="filter" id="domainBox" hidden>
        <label for="domainFilter">Domain</label>
        <select id="domainFilter"></select>
      </div>
      <div class="filter">
        <label for="odcFilter">ODC Primary</label>
        <select id="odcFilter"></select>
      </div>
      <div class="filter">
        <label for="sysFilter">System ID</label>
        <select id="sysFilter"></select>
      </div>
      <button class="btn" id="clearFilters" type="button" hidden>✕ Clear filters</button>
      <span class="muted" id="scope"></span>
    </section>
    <div class="legend" id="legend"></div>

    <div class="error" id="error" hidden></div>

    <h2 class="section-title">SLA Status <span class="muted">— days left until SLA deadline</span></h2>
    <section class="cards" id="slaCards"></section>

    <h2 class="section-title">Attention</h2>
    <section class="cards" id="alertCards"></section>

    <h2 class="section-title">By ODC Primary</h2>
    <div class="table-wrap"><table class="matrix" id="matrix"></table></div>

    <section class="details" id="details" hidden>
      <div class="details-head">
        <h2 id="detailsTitle"></h2>
        <input type="search" id="detailsSearch" placeholder="Search in these rows…">
        <button class="btn" id="closeDetails" type="button">✕ Close</button>
      </div>
      <div class="table-wrap details-wrap"><table class="grid" id="detailsTable"></table></div>
    </section>
  </main>

  <script src="js/app.js?v=6"></script>
</body>
</html>
